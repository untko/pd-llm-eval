name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate example dataset
        run: pd-eval validate examples/example_cases.jsonl
      - name: Validate smoke suite
        run: |
          for file in datasets/smoke_v1/*.jsonl; do
            pd-eval validate "$file"
          done
      - name: Dry-run smoke batch
        run: pd-eval run-yellow datasets/smoke_v1 --dry-run
