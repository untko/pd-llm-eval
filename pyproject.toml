[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pd-llm-eval"
version = "0.1.0"
description = "Platform-neutral LLM evaluation dataset and harness for the PD agriculture assistant"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
pd-eval = "pd_llm_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pd_llm_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
